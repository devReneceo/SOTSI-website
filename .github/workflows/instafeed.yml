name: Refresh Instagram latest reels

# Regenera assets/data/instagram-feed.json + assets/images/instagram/latest-*.webp
# con los 3 posts más nuevos de @gary_zukav. El token vive SOLO en el Secret
# INSTAGRAM_ACCESSTOKEN (Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: "23 9 * * *"   # diario ~9:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instafeed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install webp tools
        run: sudo apt-get update -q && sudo apt-get install -y -q webp

      - name: Refresh feed
        env:
          INSTAGRAM_ACCESSTOKEN: ${{ secrets.INSTAGRAM_ACCESSTOKEN }}
        run: python3 .github/scripts/refresh_instafeed.py

      - name: Commit & push if changed
        run: |
          git add assets/data/instagram-feed.json assets/images/instagram/latest-*.webp
          if git diff --cached --quiet; then
            echo "Sin cambios — nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Instagram latest reels"
          git push
